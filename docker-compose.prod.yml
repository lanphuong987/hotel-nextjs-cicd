# docker-compose.prod.yml — Production Environment
version: '3.8'

services:
  hotel-app:
    image: ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: hotel-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BUILD_ENV=production
    env_file:
      - .env.production
    depends_on:
      mysqldb:
        condition: service_healthy
    labels:
      - "com.hotel.environment=production"
      - "com.hotel.managed-by=docker-compose"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mysqldb:
    image: mysql:8.4
    container_name: hotel-prod-mysql
    restart: always
    env_file:
      - .env.production
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
    volumes:
      - mysql-prod-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default:
    name: hotel-prod-network

volumes:
  mysql-prod-data:
