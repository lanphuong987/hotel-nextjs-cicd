name: 🚀 CI — Deploy to Development
 
# ============================================================
# Trigger: Khi PR được merge vào nhánh main
# GitHub Environment sử dụng: development
# Mục đích: Build Docker image với secret của DEV, deploy lên
#           server để đội Dev/QA test trước khi release production
# ============================================================
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'

env:
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
 
jobs:
  # ----------------------------------------------------------
  # JOB 1: Build và Push Docker Image (dùng secret của development)
  # ----------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    environment: development
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      short-sha: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=dev-,format=short
 
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILD_ENV=development
 
      - name: Print image info
        run: |
          echo "Image đã push thành công!"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

        
  # ----------------------------------------------------------
  # JOB 2: Deploy lên Development Server
  # ----------------------------------------------------------
  deploy-development:
    name: Deploy to Development Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: development

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          script: |
            set -e
 
            echo "Di chuyển vào thư mục project..."
            cd /www/wwwroot/change_hotel/hotel-nextjs-cicd
 
 
            echo "⬇Pull image dev-latest..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:dev-latest
 
            echo "Khởi động lại container với image mới..."
            docker compose -f docker-compose.dev.yml down --remove-orphans
            docker compose -f docker-compose.dev.yml up -d
 
            echo "Dọn dẹp images cũ..."
            docker image prune -f
 
            echo "Deploy development hoàn tất!"

  # ----------------------------------------------------------
  # JOB 3: Thông báo kết quả
  # ----------------------------------------------------------
  notify:
    name: 📢 Notify Result
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-development]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 🚀 Development Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Dev | ${{ needs.deploy-development.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> QA test xong → Gắn tag \`v1.x.x\` để deploy Production" >> $GITHUB_STEP_SUMMARY


  
      
