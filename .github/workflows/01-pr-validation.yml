name: PR Validation

# ============================================================
# Trigger: Mọi PR tạo vào nhánh main
# Mục đích: Kiểm tra code quality, lint, build trước khi merge
# ============================================================
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # Validate thông tin PR
  # ----------------------------------------------------------
  validate-pr:
    name: Validate PR Info
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title convention
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            hotfix
            docs
            style
            refactor
            perf
            test
            chore
            ci
          requireScope: false

      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch: $BRANCH"

          # Cho phép: feature/*, hotfix/*, fix/*,
          if [[ ! "$BRANCH" =~ ^(feature|hotfix|fix)/.+ ]]; then
            echo " Branch name '$BRANCH' không đúng convention"
            echo " Đúng format: feature/name, fix/name, hotfix/name, chore/name, release/name"
            exit 1
          fi

          echo " Branch name hợp lệ: $BRANCH"

# ----------------------------------------------------------
  # build và test project
  # ----------------------------------------------------------
  build-and-test:
    name: Code Quality & Build Check
    runs-on: ubuntu-latest
    needs: validate-pr
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
 
      - name: Install dependencies
        run: npm ci
 
      - name: Run ESLint
        run: npm run lint
 
      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Build app
        run: npm run build
        env:
          NODE_ENV: production
  # ----------------------------------------------------------
  # JOB 4: Comment kết quả lên PR
  # ----------------------------------------------------------
  pr-comment:
    name: Comment PR Result
    runs-on: ubuntu-latest
    needs: [validate-pr, build-and-test]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Comment result on PR
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              'validate-pr': '${{ needs.validate-pr.result }}',
              'build-and-test': '${{ needs.build-and-test.result }}',
            };
 
            const statusIcon = (result) => result === 'success' ? '✅' : result === 'skipped' ? '⏭️' : '❌';
 
            const body = `## 🔍 Kết Quả PR Validation
 
            | Job | Trạng thái |
            |-----|-----------|
            | Validate PR Info | ${statusIcon(jobs['validate-pr'])} ${jobs['validate-pr']} |
            | Build And Test | ${statusIcon(jobs['build-and-test'])} ${jobs['build-and-test']} 
 
            > Commit: \`${{ github.event.pull_request.head.sha }}\`
            > Thời gian: ${new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' })}
            `;
 
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
 
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Kết Quả PR Validation'));
 
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }