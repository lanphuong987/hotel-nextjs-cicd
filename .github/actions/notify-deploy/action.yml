name: Notify Deploy Result
description: >
  Posts a deployment notification to GitHub Actions Job Summary.
  On failure, opens a GitHub Issue 

inputs:
  status:
    description: 'Deployment status: success | failure | cancelled'
    required: true
  environment:
    description: 'Target environment: development | production'
    required: true
  version:
    description: 'Version or image tag being deployed'
    required: true
  actor:
    description: 'GitHub username who triggered the deploy'
    required: true
  run-url:
    description: 'URL to the GitHub Actions run'
    required: true
  # Optional — populated on failure for rollback context
  previous-version:
    description: 'Previous version'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for creating Issues on failure'
    required: true

runs:
  using: composite
  steps:
    # ----------------------------------------------------------
    # Write Job Summary 
    # ----------------------------------------------------------
    - name: Write Job Summary
      shell: bash
      run: |
        STATUS="${{ inputs.status }}"
        ENV="${{ inputs.environment }}"
        VERSION="${{ inputs.version }}"
        ACTOR="${{ inputs.actor }}"
        RUN_URL="${{ inputs.run-url }}"
        PREV="${{ inputs.previous-version }}"
        TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S UTC')

        if [ "$STATUS" = "success" ]; then
          ICON="✅"
          HEADLINE="Deploy thành công"
          COLOR="green"
        elif [ "$STATUS" = "failure" ]; then
          ICON="❌"
          HEADLINE="Deploy thất bại"
          COLOR="red"
        else
          ICON="⚠️"
          HEADLINE="Deploy bị huỷ"
          COLOR="yellow"
        fi

        cat >> $GITHUB_STEP_SUMMARY << EOF
        ## $ICON Deployment $HEADLINE

        | Thông tin | Giá trị |
        |-----------|---------|
        | - Environment | \`$ENV\` |
        | - Version | \`$VERSION\` |
        | - Triggered by | @$ACTOR |
        | - Thời gian | $TIMESTAMP |
        |  Run | [$RUN_URL]($RUN_URL) |
        EOF

        if [ -n "$PREV" ]; then
          echo "| ↩️ Previous version | \`$PREV\` |" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "$STATUS" = "failure" ]; then
          cat >> $GITHUB_STEP_SUMMARY << EOF

        ---
        > ⚠️ **Action required:** Kiểm tra logs tại link. Xem hướng dẫn nếu cần rollback
        EOF
        fi
   # ----------------------------------------------------------
    # Step 2: Telegram — PRODUCTION FAIL only
    # ----------------------------------------------------------
    - name: Telegram — Production Failure Alert
      if: inputs.status == 'failure' && inputs.environment == 'production'
      uses: appleboy/telegram-action@v1.0.0
      with:
        token: ${{ inputs.telegram-token }}
        to: ${{ inputs.telegram-chat-id }}
        format: markdown
        disable_web_page_preview: true
        message: |
          🚨 *Production Deploy FAILED*
 
          *Version:* `${{ inputs.version }}`
          *Triggered by:* @${{ inputs.actor }}
 
          ${{ inputs.previous-version != '' && format('↩️ Auto\-rollback target: `{0}`', inputs.previous-version) || '⚠️ No previous version for rollback' }}
 
          [View failed run](${{ inputs.run-url }})
          GitHub Issue đã được tạo tự động trong repo\.

    # ----------------------------------------------------------
    # Step 4: GitHub Issue — PRODUCTION FAIL only
    # ----------------------------------------------------------
    - name: GitHub Issue — Production Failure Only
      if: inputs.status == 'failure' && inputs.environment == 'production'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const version  = '${{ inputs.version }}';
          const actor    = '${{ inputs.actor }}';
          const runUrl   = '${{ inputs.run-url }}';
          const prev     = '${{ inputs.previous-version }}';
          const timestamp = new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });
 
          const rollbackSection = prev ? `
          ## ↩️ Rollback Instructions
          \`\`\`bash
          cd /www/wwwroot/change_hotel/hotel-nextjs-cicd
          sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=${prev}/" .env.production
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d
          \`\`\`
          Hoặc re-trigger workflow với tag \`${prev}\`.` : '';
 
          const { data: issue } = await github.rest.issues.create({
            owner: context.repo.owner,
            repo:  context.repo.repo,
            title: `🚨 [PRODUCTION] Deploy failed: v${version}`,
            labels: ['bug', 'deploy-failure', 'production'],
            body: `## ❌ Production Deploy Failed — v${version}
 
          | | |
          |---|---|
          | **Time** | ${timestamp} |
          | **Version** | \`${version}\` |
          | **Triggered by** | @${actor} |
          | **Run** | ${runUrl} |
          ${prev ? `| **Rollback target** | \`${prev}\` |` : ''}
 
          ## 📋 Incident Checklist
          - [ ] Check logs in the Actions run (link above)
          - [ ] Identify failure stage: build / SSH connect / health check / rollback
          - [ ] Confirm whether auto-rollback succeeded (check server)
          - [ ] Fix root cause or perform manual rollback if needed
          - [ ] Re-deploy or push hotfix
          - [ ] Close this issue once resolved
          ${rollbackSection}
 
          ---
          *Auto-created by CI/CD pipeline. Close when resolved.*`,
          });
 
          console.log(`✅ Issue created: ${issue.html_url}`);
 
          await core.summary
            .addRaw(`\n> 🚨 **Issue created:** [${issue.title}](${issue.html_url})\n`)
            .write();