name: Docker Build & Push
description: 
  Builds a Docker image with full metadata labels, pushes to Docker Hub,
  and outputs the digest and tags. Uses GitHub Actions cache for speed.

inputs:
  docker-username:
    description: 'Docker Hub username'
    required: true
  docker-token:
    description: 'Docker Hub access token'
    required: true
  image-name:
    description: 'Docker image name'
    required: true
  tags:
    description: 'Metadata-action tag rules'
    required: true
  build-env:
    description: 'Build environment label: development | production'
    required: false
    default: 'production'
  app-version:
    description: 'App version to embed as build-arg'
    required: false
    default: 'unknown'

outputs:
  digest:
    description: 'Image digest'
    value: ${{ steps.build.outputs.digest }}
  tags:
    description: 'Comma-separated list of full image tags pushed'
    value: ${{ steps.meta.outputs.tags }}
  primary-tag:
    description: 'First tag in the list'
    value: ${{ steps.primary.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=moby/buildkit:latest

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-token }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.docker-username }}/${{ inputs.image-name }}
        tags: ${{ inputs.tags }}
        labels: |
          org.opencontainers.image.title=${{ inputs.image-name }}
          org.opencontainers.image.version=${{ inputs.app-version }}
          org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ssZ'}}
          org.opencontainers.image.revision={{sha}}
          com.hotel.build-env=${{ inputs.build-env }}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ inputs.build-env }}
        cache-to: type=gha,mode=max,scope=${{ inputs.build-env }}
        provenance: false
        build-args: |
          NODE_ENV=production
          BUILD_ENV=${{ inputs.build-env }}
          APP_VERSION=${{ inputs.app-version }}

    - name: Extract primary tag
      id: primary
      shell: bash
      run: |
        # Lấy tag đầu tiên trong danh sách (specific nhất)
        FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
        echo "tag=$FIRST_TAG" >> $GITHUB_OUTPUT
        echo "Primary tag: $FIRST_TAG"
        echo "Digest: ${{ steps.build.outputs.digest }}"